# Agentic BI - Docker Compose Override for Astro CLI
#
# Owns the Sprint 1 local data foundation services used by Astro:
# ClickHouse for raw/staging/mart tables and MinIO for raw JSONL batches.

services:
  api-server:
    ports:
      - "18080:8080"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: agentic_clickhouse
    environment:
      - CLICKHOUSE_PASSWORD=${AGENTIC_CLICKHOUSE_PASSWORD:-securepassword}
    ports:
      - "18123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - airflow
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "19001:9000"
      - "19002:9001"
    volumes:
      - minio_data:/data
    networks:
      - airflow
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  airflow:

volumes:
  clickhouse_data:
  minio_data:
