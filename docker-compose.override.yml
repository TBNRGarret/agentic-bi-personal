# Agentic BI - Docker Compose Override for Astro CLI
#
# Strategy:
#   - Own ClickHouse for Agentic BI silver/gold tables.
#   - Reuse existing sprint-1 services via dwh_network/signoz-net.
#   - Airflow containers are connected post-start via scripts/connect-networks.ps1.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: agentic_clickhouse
    environment:
      - CLICKHOUSE_PASSWORD=${AGENTIC_CLICKHOUSE_PASSWORD:-securepassword}
    ports:
      - "18123:8123"   # HTTP, offset to avoid SigNoz ClickHouse on 8123
      - "19000:9000"   # Native TCP, offset to avoid conflict
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - airflow
      - dwh_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "19001:9000"
      - "19002:9001"
    volumes:
      - minio_data:/data
    networks:
      - airflow
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  airflow:
  dwh_network:
    external: true
    name: dwh_network

volumes:
  clickhouse_data:
  minio_data:
