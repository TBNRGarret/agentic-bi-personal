version: 2

models:
  - name: daily_llm_costs
    description: "Daily LLM cost and usage by model and owner"
    columns:
      - name: date
        tests: [not_null]
      - name: total_cost_usd
        tests: [not_null]

  - name: model_performance
    description: "Model performance metrics (latency, error rate)"
    columns:
      - name: model
        tests: [not_null]

  - name: owner_comparison
    description: "Environment usage comparison across AN, BACH, HOANG, TUAN"
    columns:
      - name: source_owner
        tests: [unique, not_null]

  - name: trace_summary
    description: "System trace summary per service"
    columns:
      - name: service_name
        tests: [not_null]

  - name: service_logs_summary
    description: "System logs summary per service per day"
    columns:
      - name: service_name
        tests: [not_null]
      - name: date
        tests: [not_null]
