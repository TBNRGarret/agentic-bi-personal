# Agentic BI - Docker Compose
#
# Data foundation services + Astro CLI sidecars.
# Airflow itself is managed via Astro CLI: `astro dev start` / `astro dev stop`.

services:
  # ── Data Warehouse ──────────────────────────────────────────
  postgres-dwh:
    image: postgres:16-alpine
    container_name: agentic-bi-postgres-dwh
    restart: unless-stopped
    environment:
      POSTGRES_DB: central_dwh
      POSTGRES_USER: dwh_admin
      POSTGRES_PASSWORD: dwh_admin_password
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
      - ./dwh/init:/docker-entrypoint-initdb.d:ro
    networks:
      - airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh_admin -d central_dwh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO (Object Store) ────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agentic-bi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "19001:9000"
      - "19002:9001"
    volumes:
      - minio_data:/data
    networks:
      - airflow
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: agentic-bi-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          sleep 2
        done
        mc mb -p local/agentic-bi-raw
        mc ls local
    networks:
      - airflow

  # ── ClickHouse (Analytics DB) ───────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: agentic_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_PASSWORD: ${AGENTIC_CLICKHOUSE_PASSWORD:-securepassword}
    ports:
      - "18123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - airflow
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Metabase (BI / Dashboards) ──────────────────────────────
  metabase-db:
    image: postgres:16-alpine
    container_name: agentic-bi-metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase_password
      TZ: UTC
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    networks:
      - airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  metabase:
    image: metabase/metabase:latest
    container_name: agentic-bi-metabase
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
      postgres-dwh:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase_password
      MB_DB_HOST: metabase-db
      MB_SITE_NAME: Agentic BI
      MB_SITE_URL: http://localhost:3000
      TZ: UTC
    ports:
      - "3000:3000"
    networks:
      - airflow

  # ── Observation Service (Backend API) ───────────────────────
  observation-service:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: agentic_observation_service
    restart: unless-stopped
    environment:
      OBSERVATION_ENVIRONMENT: ${OBSERVATION_ENVIRONMENT:-local}
      OBSERVATION_REPO_ROOT: /workspace
      SOURCE_APP_ID: ${SOURCE_APP_ID:-agentic-bi-terminal-agent}
      OBSERVATION_TERMINAL_TIMEOUT_SECONDS: ${OBSERVATION_TERMINAL_TIMEOUT_SECONDS:-5}
      OBSERVATION_TERMINAL_MAX_OUTPUT_CHARS: ${OBSERVATION_TERMINAL_MAX_OUTPUT_CHARS:-12000}
      OBSERVATION_TERMINAL_ALLOWLIST: ${OBSERVATION_TERMINAL_ALLOWLIST:-date,whoami,pwd,ls,git status,python --version,python -V}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${AGENTIC_CLICKHOUSE_PASSWORD:-securepassword}
      CLICKHOUSE_SECURE: "false"
      OBSERVATION_QUERY_TIMEOUT_SECONDS: ${OBSERVATION_QUERY_TIMEOUT_SECONDS:-10}
      DISABLED_ANALYTICS_TABLES: ${DISABLED_ANALYTICS_TABLES:-}
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL:-http://datahub-gms:8080}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-agentic-bi-observation-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-otel-collector:4317}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "18000:8000"
    volumes:
      - .:/workspace:ro
    networks:
      - airflow
    depends_on:
      clickhouse:
        condition: service_healthy

networks:
  airflow:
    driver: bridge

volumes:
  postgres_dwh_data:
  minio_data:
  metabase_db_data:
  clickhouse_data:
