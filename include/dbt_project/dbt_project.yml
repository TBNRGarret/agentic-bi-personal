name: 'dbt_project'
version: '1.0.0'
config-version: 2

profile: 'dbt_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "/tmp/dbt_target"
log-path: "/tmp/dbt_logs"
packages-install-path: "/tmp/dbt_packages"

clean-targets:
  - "/tmp/dbt_target"
  - "/tmp/dbt_packages"

models:
  dbt_project:
    silver:
      +materialized: table
      +schema: vsf_stg
      +engine: ReplacingMergeTree()
    gold:
      +materialized: table
      +schema: vsf_mart
      +engine: ReplacingMergeTree()

seeds:
  dbt_project:
    +schema: vsf_mart
    source_apps:
      +column_types:
        source_app_id: String
        source_app_name: String
        domain: String
        environment: String
        owner_team: String
        source_dwh_type: String
        source_dwh_name: String
        is_active: UInt8
        created_at: "DateTime64(6, 'UTC')"
        updated_at: "DateTime64(6, 'UTC')"
